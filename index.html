<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahora - Handcraft Creations</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-wrapper">
        <img src="assets/img/bg.jpg" alt="Background Texture" class="bg-image">
    </div>

    <!-- Torn Edges -->
    <div class="torn-edges">
        <img src="assets/img/s1.png" alt="" class="edge edge-top-left">
        <img src="assets/img/s2.png" alt="" class="edge edge-bottom-right">
    </div>

    <header id="main-header">
        <div class="logo-container">
            <img src="assets/img/ahoralogo.png" alt="Ahora Logo" id="logo">
        </div>

        <nav class="hamburger-menu">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon">
                <span class="nav-icon"></span>
            </label>
            <ul class="menu-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Our work</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Initial Content Section -->
    <main id="intro-section" class="content-section">
        <h1 class="intro-text">
            The ones you love deserve something truly special...<br>
            are you ready to give something this special?
        </h1>
        <button id="iam-btn" class="minimal-btn">I AM!</button>
    </main>

    <!-- Gift Reveal Section -->
    <section id="gift-section" class="hidden-section">
        <div class="glow-effect"></div>
        <img src="assets/img/gift.png" alt="Special Gift" id="gift-image">
    </section>

    <!-- Petals Canvas -->
    <div id="petals-container"></div>

    <script src="js/script.js"></script>
</body>
</html>
